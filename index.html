<script>
const D=new Date(),Y=D.getFullYear(),Mo=D.getMonth(),pad=n=>String(n).padStart(2,'0'),iso=d=>`${Y}-${pad(Mo+1)}-${pad(d)}`,TD=D.getDate(),T=iso(TD);
const mins=t=>{const[a,b]=t.split(':');return +a*60+ +b},nowT=()=>pad(new Date().getHours())+':'+pad(new Date().getMinutes());
const F=[['name','الاسم'],['no','الرقم الوظيفي'],['phone','رقم الجوال'],['dept','القسم'],['mgr','المدير المباشر'],['title','المسمى الوظيفي'],['nat','الجنسية'],['addr','العنوان'],['salary','الراتب الأساسي','number'],['ins','بداية الدوام','time'],['outs','نهاية الدوام','time'],['cs','بداية العقد','date'],['ce','نهاية العقد','date'],['otAmt','قيمة الإضافي','number'],['otWhy','سبب الإضافي'],['user','اسم المستخدم'],['pass','كلمة المرور']];
const S={u:null,tab:'dash',ch:1001,form:null,emps:[
{id:1001,name:'سلطان العتيبي',no:'1001',phone:'0551234567',dept:'العمليات',mgr:'أحمد المطيري',title:'منسق شحن',nat:'سعودي',addr:'الرياض - حي النزهة',salary:6000,ins:'08:00',outs:'17:00',cs:'2026-01-01',ce:'2026-12-31',otAmt:300,otWhy:'تحميل شحنة عاجلة',user:'sultan',pass:'1234'},
{id:1002,name:'محمد الشهري',no:'1002',phone:'0509876543',dept:'المستودعات',mgr:'أحمد المطيري',title:'أمين مستودع',nat:'مصري',addr:'الرياض - حي السلي',salary:4500,ins:'08:00',outs:'17:00',cs:'2026-03-01',ce:'2026-11-20',otAmt:0,otWhy:'',user:'mohammed',pass:'1234'},
{id:1003,name:'خالد القحطاني',no:'1003',phone:'0561112233',dept:'النقل',mgr:'سلطان العتيبي',title:'سائق',nat:'سعودي',addr:'الرياض - حي العزيزية',salary:4000,ins:'07:00',outs:'16:00',cs:'2026-02-01',ce:'2027-01-31',otAmt:150,otWhy:'رحلة خارج الجدول',user:'khaled',pass:'1234'}],
att:{},tasks:[{id:1,emp:1001,t:'تسليم بيان الشحنة لجمارك الرياض',pr:'عالية',due:T,st:'قيد التنفيذ'},{id:2,emp:1002,t:'جرد مستودع B',pr:'متوسطة',due:T,st:'جديدة'}],
reqs:[{id:1,emp:1002,type:'سلفة',amt:1000,why:'ظرف عائلي',st:'بانتظار الموافقة'},{id:2,emp:1003,type:'إجازة',from:iso(TD+3),to:iso(TD+5),why:'سفر',st:'بانتظار الموافقة'}],
chat:[{emp:1001,from:'admin',t:'صباح الخير، لا تنسَ بيان الشحنة اليوم',tm:'08:05'}],ded:{}};
S.emps.forEach(e=>{for(let d=1;d<TD;d++){const w=new Date(Y,Mo,d).getDay();if(w>4||(e.id==1002&&d%6==3))continue;S.att[e.id+'|'+iso(d)]={i:e.id==1002&&d%4==0?'08:'+(20+d%20):e.ins.slice(0,4)+(d%9),o:e.outs.slice(0,4)+(d%9)}}});
S.att['1001|'+T]={i:'07:58'};S.att['1002|'+T]={i:'08:25'};
const emp=id=>S.emps.find(e=>e.id==id),A=(e,d)=>S.att[e.id+'|'+d];
const excused=(e,d)=>S.reqs.some(r=>r.emp==e.id&&r.type=='إجازة'&&r.st=='تمت الموافقة'&&r.from<=d&&d<=r.to);
function status(e,d){const a=A(e,d),w=new Date(d).getDay();if(!a)return w>4?['راحة','']:excused(e,d)?['إجازة','']:d>T?['—','']:d==T?['لم يسجل بعد','warn']:['غائب','bad'];const l=mins(a.i)-mins(e.ins)-10;if(!a.o&&d<T)return['تسجيل ناقص','warn'];return l>0?['متأخر '+(l+10)+' د','warn']:['حاضر','ok']}
const tg=(s)=>`<span class="tag ${s[1]}">${s[0]}</span>`;
function absent(e){let n=0;for(let d=1;d<TD;d++){const k=iso(d);if(new Date(k).getDay()<=4&&!A(e,k)&&!excused(e,k))n++}return n}
const adv=e=>S.reqs.filter(r=>r.emp==e.id&&r.type=='سلفة'&&r.st=='تمت الموافقة').reduce((s,r)=>s+r.amt,0);
const net=e=>{const x=S.ded[e.id]||{};return +e.salary+ +e.otAmt-(+x.inst||0)-(+x.v||0)};
const nm=id=>emp(id).name;
function login(){return `<div class="login"><div class="lbox"><div class="logo"><b>JADEER <i>4</i></b><small>LOGISTICS</small></div><h2 style="margin:22px 0 14px">تسجيل الدخول</h2><label>اسم المستخدم</label><input id="lu" autocomplete="username"><label style="margin-top:10px">كلمة المرور</label><input id="lp" type="password" autocomplete="current-password"><p id="le" class="hint" style="color:var(--bad);min-height:22px"></p><button class="b" style="width:100%" data-a="login">دخول</button><p class="hint" style="margin-top:16px">نسخة تجريبية. الأدمن: admin / admin. موظف: sultan / 1234</p></div></div>`}
const NAV=[['dash','لوحة التحكم'],['emps','الموظفون'],['att','الحضور والتقارير'],['tasks','المهام'],['reqs','الطلبات'],['pay','مسير الرواتب'],['chat','الرسائل']],ENAV=[['home','حضوري ومهامي'],['myreq','طلباتي'],['chat','الرسائل']];
function shell(body){const nav=S.u.admin?NAV:ENAV;return `<div class="app"><nav class="side"><div class="logo"><b>JADEER <i>4</i></b><small>LOGISTICS</small></div>${nav.map(n=>`<button class="${S.tab==n[0]?'on':''}" data-a="tab" data-v="${n[0]}">${n[1]}</button>`).join('')}<button class="out" data-a="out">خروج</button></nav><main>${body}</main></div>`}
function dash(){const as=S.emps.map(e=>status(e,T)[0]);const c=f=>as.filter(f).length,p=S.reqs.filter(r=>r.st=='بانتظار الموافقة').length,tk=S.tasks.filter(t=>t.st!='تمت المهمة');
const soon=S.emps.filter(e=>(new Date(e.ce)-D)/864e5<60);
return `<h2>ملخص اليوم</h2><div class="kpis"><div class="k"><b>${S.emps.length}</b><span>موظف نشط</span></div><div class="k"><b>${c(x=>x=='حاضر'||x.startsWith('متأخر'))}</b><span>حضروا اليوم</span></div><div class="k"><b>${c(x=>x.startsWith('متأخر'))}</b><span>متأخرون</span></div><div class="k"><b>${p}</b><span>طلبات تنتظر قرارك</span></div><div class="k"><b>${tk.length}</b><span>مهام مفتوحة</span></div><div class="k"><b>${soon.length}</b><span>عقود تنتهي خلال 60 يوم</span></div></div>
<div class="card"><h3>حضور اليوم</h3>${attTable(T)}</div><div class="card"><h3>عقود قريبة الانتهاء</h3>${soon.map(e=>`<p>${e.name} — ينتهي ${e.ce}</p>`).join('')||'<p class="hint">لا توجد عقود قريبة الانتهاء</p>'}</div>`}
function attTable(d){return `<div class="tw"><table><tr><th>الموظف</th><th>الدوام</th><th>الحضور</th><th>الانصراف</th><th>الحالة</th><th>تسجيل يدوي</th></tr>${S.emps.map(e=>{const a=A(e,d)||{};return `<tr><td>${e.name}</td><td>${e.ins} - ${e.outs}</td><td>${a.i||'—'}</td><td>${a.o||'—'}</td><td>${tg(status(e,d))}</td><td>${d==T?`<button class="b g s" data-a="mark" data-v="${e.id}|i">حضور</button> <button class="b g s" data-a="mark" data-v="${e.id}|o">انصراف</button>`:''}</td></tr>`}).join('')}</table></div>`}
function emps(){const f=S.form;let h=`<div class="row" style="justify-content:space-between"><h2>الموظفون</h2><button class="b" data-a="newEmp">إضافة موظف</button></div>`;
if(f)h+=`<div class="card"><h3>${f.id?'تعديل بيانات '+f.name:'موظف جديد'}</h3><div class="fg">${F.map(x=>`<div><label>${x[1]}</label><input data-f="${x[0]}" type="${x[2]||'text'}" value="${f[x[0]]??''}"></div>`).join('')}</div><div class="row"><button class="b" data-a="saveEmp">حفظ</button><button class="b g" data-a="cancel">إلغاء</button></div></div>`;
return h+`<div class="card tw"><table><tr><th>الرقم</th><th>الاسم</th><th>المسمى</th><th>القسم</th><th>المدير</th><th>الجوال</th><th>العقد</th><th>المستخدم</th><th></th></tr>${S.emps.map(e=>`<tr><td>${e.no}</td><td>${e.name}</td><td>${e.title}</td><td>${e.dept}</td><td>${e.mgr}</td><td>${e.phone}</td><td>${e.cs} → ${e.ce}</td><td>${e.user}</td><td><button class="b g s" data-a="editEmp" data-v="${e.id}">تعديل</button></td></tr>`).join('')}</table></div>`}
function attPage(){const days=[];for(let d=1;d<=TD;d++)if(new Date(iso(d)).getDay()<=4)days.push(d);
return `<h2>الحضور والانصراف</h2><div class="card"><h3>تقرير اليوم</h3>${attTable(T)}</div><div class="card tw"><h3>التقرير الشهري</h3><table><tr><th>الموظف</th><th>أيام الحضور</th><th>أيام الغياب</th><th>مرات التأخير</th><th>تسجيلات ناقصة</th></tr>${S.emps.map(e=>{let p=0,l=0,m=0;days.forEach(d=>{const s=status(e,iso(d))[0];if(s=='حاضر')p++;if(s.startsWith('متأخر')){p++;l++}if(s=='تسجيل ناقص'){p++;m++}});return `<tr><td>${e.name}</td><td>${p}</td><td>${absent(e)}</td><td>${l}</td><td>${m}</td></tr>`}).join('')}</table></div>`}
function tasks(){return `<h2>المهام</h2><div class="card"><h3>إسناد مهمة</h3><div class="fg"><div><label>الموظف</label><select id="tE">${S.emps.map(e=>`<option value="${e.id}">${e.name}</option>`).join('')}</select></div><div><label>المهمة</label><input id="tT"></div><div><label>الأولوية</label><select id="tP"><option>عالية</option><option>متوسطة</option><option>منخفضة</option></select></div><div><label>موعد التسليم</label><input id="tD" type="date" value="${T}"></div></div><button class="b" data-a="addTask">إرسال المهمة</button></div><div class="card tw"><table><tr><th>الموظف</th><th>المهمة</th><th>الأولوية</th><th>التسليم</th><th>الحالة</th></tr>${S.tasks.map(t=>`<tr><td>${nm(t.emp)}</td><td>${t.t}</td><td>${t.pr}</td><td>${t.due}</td><td>${tg([t.st,t.st=='تمت المهمة'?'ok':t.st=='قيد التنفيذ'?'warn':''])}</td></tr>`).join('')}</table></div>`}
function reqs(){return `<h2>طلبات الإجازة والسلف</h2><div class="card tw"><table><tr><th>الموظف</th><th>النوع</th><th>التفاصيل</th><th>السبب</th><th>الحالة</th><th></th></tr>${S.reqs.map(r=>`<tr><td>${nm(r.emp)}</td><td>${r.type}</td><td>${r.type=='سلفة'?r.amt+' ر.س':r.from+' → '+r.to}</td><td>${r.why}</td><td>${tg([r.st,r.st=='تمت الموافقة'?'ok':r.st=='مرفوض'?'bad':'warn'])}</td><td>${r.st=='بانتظار الموافقة'?`<button class="b s" data-a="dec" data-v="${r.id}|تمت الموافقة">موافقة</button> <button class="b g s" data-a="dec" data-v="${r.id}|مرفوض">رفض</button>`:''}</td></tr>`).join('')}</table></div>`}
function pay(){const tot=S.emps.reduce((s,e)=>s+net(e),0);return `<h2>مسير رواتب ${pad(Mo+1)}/${Y}</h2><div class="card tw"><table><tr><th>الموظف</th><th>الأساسي</th><th>الإضافي</th><th>أيام الغياب</th><th>قسط السلفة</th><th>الخصم (تحدده أنت)</th><th>الصافي</th></tr>${S.emps.map(e=>{const x=S.ded[e.id]||{inst:'',v:''};return `<tr><td>${e.name}</td><td>${e.salary}</td><td>${e.otAmt}</td><td>${absent(e)}</td><td><input style="width:90px" type="number" data-c="inst|${e.id}" value="${x.inst}" placeholder="${adv(e)||0}"></td><td><input style="width:90px" type="number" data-c="v|${e.id}" value="${x.v}"></td><td><b>${net(e)}</b></td></tr>`}).join('')}</table></div><p class="hint">الصافي = الأساسي + الإضافي − قسط السلفة − الخصم. أيام الغياب للاسترشاد فقط، ولا يوجد خصم تلقائي. الإجمالي: <b>${tot}</b> ر.س</p>`}
function chat(){const id=S.u.admin?S.ch:S.u.id,ms=S.chat.filter(m=>m.emp==id);return `<h2>الرسائل</h2>${S.u.admin?`<div class="row" style="margin-bottom:12px">${S.emps.map(e=>`<button class="b ${e.id==id?'':'g'} s" data-a="ch" data-v="${e.id}">${e.name}</button>`).join('')}</div>`:''}<div class="card"><div class="chat">${ms.map(m=>`<div class="m ${(m.from=='admin')==S.u.admin?'me':''}">${m.t}<div class="hint" style="color:inherit;opacity:.7">${m.tm}</div></div>`).join('')||'<p class="hint">ابدأ المحادثة</p>'}</div><div class="row"><input id="cm" style="flex:1" placeholder="اكتب رسالتك"><button class="b" data-a="send">إرسال</button></div></div>`}
function home(){const e=emp(S.u.id),a=A(e,T)||{};return `<h2>أهلًا ${e.name.split(' ')[0]}</h2><div class="card"><p class="hint">دوامك اليوم ${e.ins} - ${e.outs}</p><p class="big">${a.i?(a.o?'تم تسجيل الانصراف':'حاضر منذ '+a.i):'لم تسجل حضورك'}</p><div class="row">${tg(status(e,T))}${!a.i?`<button class="b" data-a="self" data-v="i">تسجيل حضور</button>`:!a.o?`<button class="b" data-a="self" data-v="o">تسجيل انصراف</button>`:''}</div></div><div class="card"><h3>مهامي</h3>${S.tasks.filter(t=>t.emp==e.id).map(t=>`<div class="row" style="justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)"><span>${t.t}<br><span class="hint">التسليم ${t.due} — أولوية ${t.pr}</span></span><select data-c="task|${t.id}" style="width:auto"><option ${t.st=='جديدة'?'selected':''}>جديدة</option><option ${t.st=='قيد التنفيذ'?'selected':''}>قيد التنفيذ</option><option ${t.st=='تمت المهمة'?'selected':''}>تمت المهمة</option></select></div>`).join('')||'<p class="hint">لا توجد مهام</p>'}</div>`}
function myreq(){const id=S.u.id;return `<h2>طلباتي</h2><div class="card"><h3>طلب جديد</h3><div class="fg"><div><label>النوع</label><select id="rT"><option>إجازة</option><option>سلفة</option></select></div><div><label>من</label><input id="rF" type="date"></div><div><label>إلى</label><input id="rO" type="date"></div><div><label>مبلغ السلفة</label><input id="rA" type="number"></div><div><label>السبب</label><input id="rW"></div></div><button class="b" data-a="addReq">إرسال الطلب</button></div><div class="card tw"><table><tr><th>النوع</th><th>التفاصيل</th><th>الحالة</th></tr>${S.reqs.filter(r=>r.emp==id).map(r=>`<tr><td>${r.type}</td><td>${r.type=='سلفة'?r.amt+' ر.س':r.from+' → '+r.to}</td><td>${tg([r.st,r.st=='تمت الموافقة'?'ok':r.st=='مرفوض'?'bad':'warn'])}</td></tr>`).join('')}</table></div>`}
S.ch=null;S.chat.push({emp:1002,from:'emp',t:'السلام عليكم، ممكن أطلب سلفة؟',tm:'09:10'},{emp:1002,from:'admin',t:'وعليكم السلام، قدّم الطلب من صفحة طلباتي',tm:'09:14'},{emp:1003,from:'emp',t:'وصلت موقع التسليم، بانتظار الاستلام',tm:'10:02'});
const IC={dash:'M3 12l9-9 9 9M5 10v10h14V10',home:'M3 12l9-9 9 9M5 10v10h14V10',emps:'M17 21v-2a4 4 0 00-4-4H7a4 4 0 00-4 4v2M10 11a4 4 0 100-8 4 4 0 000 8M21 21v-2a4 4 0 00-3-3.9M16 3.1a4 4 0 010 7.8',att:'M12 8v4l3 2M12 22a10 10 0 100-20 10 10 0 000 20',tasks:'M9 11l3 3L22 4M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11',reqs:'M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8zM14 2v6h6M8 13h8M8 17h8',myreq:'M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8zM14 2v6h6M8 13h8M8 17h8',pay:'M12 1v22M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6',chat:'M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z'};
const ic=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${IC[k]}"/></svg>`;
const SL={dash:'الرئيسية',emps:'الموظفون',att:'الحضور',tasks:'المهام',reqs:'الطلبات',pay:'الرواتب',chat:'الرسائل',home:'الرئيسية',myreq:'طلباتي'};
function login(){return `<div class="lg"><section class="hero"><svg class="route" viewBox="0 0 400 300" aria-hidden="true"><path d="M-10 240C60 240 80 150 160 150S260 220 320 120 410 60 420 40"/><circle cx="160" cy="150" r="6"/><circle cx="320" cy="120" r="6"/></svg><div class="logo big"><b>JADEER <i>4</i></b><small>LOGISTICS</small></div><h1>إدارة فريقك في مكان واحد</h1><p>حضور وانصراف، مهام، طلبات ورواتب، كل شيء يتحرك بدقة مثل شحناتك.</p></section><section class="fm"><h2>أهلًا بعودتك</h2><p class="hint" style="margin:0">سجّل دخولك للمتابعة</p><label>اسم المستخدم</label><input id="lu" autocomplete="username" autocapitalize="none"><label>كلمة المرور</label><div class="pw"><input id="lp" type="password" autocomplete="current-password"><button type="button" class="eye" data-a="eye">إظهار</button></div><p id="le" class="hint" style="color:var(--bad);min-height:22px;margin:6px 0"></p><button class="b lgbtn" data-a="login">دخول</button><div class="demo"><span class="hint">حسابات تجريبية، اضغط للتعبئة</span><div class="row"><button class="chip" data-a="fill" data-v="admin|admin">مدير النظام</button><button class="chip" data-a="fill" data-v="sultan|1234">موظف</button></div></div></section></div>`}
function shell(body){const nav=S.u.admin?NAV:ENAV,un=S.chat.filter(m=>S.u.admin?(m.from=='emp'&&!m.r):(m.emp==S.u.id&&m.from=='admin'&&!m.r)).length,bd=k=>k=='chat'&&un?`<em>${un}</em>`:'',who=S.u.admin?'مدير النظام':emp(S.u.id).name,lg='<div class="logo"><b>JADEER <i>4</i></b><small>LOGISTICS</small></div>';
return `<div class="app2"><aside class="sb">${lg}${nav.map(n=>`<button class="${S.tab==n[0]?'on':''}" data-a="tab" data-v="${n[0]}">${ic(n[0])}<span>${n[1]}</span>${bd(n[0])}</button>`).join('')}<div class="me"><span class="av">${who[0]}</span><span>${who}</span><button class="out2" data-a="out">خروج</button></div></aside><header class="top">${lg}<div class="row"><span class="av">${who[0]}</span><button class="out2" data-a="out">خروج</button></div></header><main>${body}</main><nav class="bn">${nav.map(n=>`<button class="${S.tab==n[0]?'on':''}" data-a="tab" data-v="${n[0]}">${ic(n[0])}<span>${SL[n[0]]}</span>${bd(n[0])}</button>`).join('')}</nav></div>`}
function chat(){const adm=S.u.admin;
if(adm&&!S.ch){const last=id=>S.chat.filter(m=>m.emp==id).slice(-1)[0],un=id=>S.chat.filter(m=>m.emp==id&&m.from=='emp'&&!m.r).length;
return `<h2>الرسائل</h2><div class="card cl">${S.emps.map(e=>{const l=last(e.id),u=un(e.id);return `<button class="ci" data-a="ch" data-v="${e.id}"><span class="av">${e.name[0]}</span><span class="ct"><b>${e.name}</b><small>${l?(l.from=='admin'?'أنت: ':'')+l.t:'ابدأ محادثة جديدة'}</small></span><span class="cm">${l?l.tm:''}${u?`<em>${u}</em>`:''}</span></button>`}).join('')}</div>`}
const id=adm?S.ch:S.u.id;S.chat.forEach(m=>{if(m.emp==id&&(adm?m.from=='emp':m.from=='admin'))m.r=1});
const ms=S.chat.filter(m=>m.emp==id),e=emp(id);
return `<div class="th"><div class="thh">${adm?`<button class="b g s" data-a="back">رجوع</button>`:''}<span class="av">${adm?e.name[0]:'م'}</span><div><b>${adm?e.name:'مدير النظام'}</b><small class="hint">${adm?e.title+' - '+e.dept:'جادير 4 لوجستيكس'}</small></div></div><div class="msgs" id="msgs">${ms.map(m=>`<div class="m ${(m.from=='admin')==adm?'me':''}">${m.t}<span>${m.tm}</span></div>`).join('')||'<p class="hint" style="text-align:center">لا توجد رسائل بعد. ابدأ المحادثة.</p>'}</div><div class="cmp"><input id="cm" placeholder="اكتب رسالتك..." autocomplete="off"><button class="b" data-a="send">إرسال</button></div></div>`}
const V={dash,emps,att:attPage,tasks,reqs,pay,chat,home,myreq};
function render(){const r=document.getElementById('root');r.innerHTML=S.u?shell(V[S.tab]()):login();const m=document.getElementById('msgs');if(m)m.scrollTop=m.scrollHeight}
const g=id=>document.getElementById(id).value,v2=b=>b.dataset.v;
const H={
login(){const u=g('lu').trim(),p=g('lp');if(u=='admin'&&p=='admin'){S.u={admin:1};S.tab='dash'}else{const e=S.emps.find(e=>e.user==u&&e.pass==p);if(!e){document.getElementById('le').textContent='اسم المستخدم أو كلمة المرور غير صحيحة';return}S.u={id:e.id};S.tab='home'}render()},
out(){S.u=null;render()},tab(b){S.tab=v2(b);S.form=null;render()},
mark(b){const[id,k]=v2(b).split('|'),key=id+'|'+T;S.att[key]=S.att[key]||{};S.att[key][k]=nowT();render()},
self(b){const key=S.u.id+'|'+T;S.att[key]=S.att[key]||{};S.att[key][v2(b)]=nowT();render()},
newEmp(){S.form={};render()},editEmp(b){S.form={...emp(v2(b))};render()},cancel(){S.form=null;render()},
saveEmp(){const o={};document.querySelectorAll('[data-f]').forEach(i=>o[i.dataset.f]=i.value);if(!o.name||!o.user||!o.pass){alert('الاسم واسم المستخدم وكلمة المرور مطلوبة');return}if(S.form.id)Object.assign(emp(S.form.id),o);else S.emps.push({...o,id:Date.now()});S.form=null;render()},
addTask(){if(!g('tT').trim())return;S.tasks.push({id:Date.now(),emp:+g('tE'),t:g('tT'),pr:g('tP'),due:g('tD'),st:'جديدة'});render()},
addReq(){const t=g('rT');if(t=='سلفة'&&!+g('rA')||t=='إجازة'&&!(g('rF')&&g('rO'))){alert('أكمل بيانات الطلب');return}S.reqs.push({id:Date.now(),emp:S.u.id,type:t,amt:+g('rA'),from:g('rF'),to:g('rO'),why:g('rW'),st:'بانتظار الموافقة'});render()},
dec(b){const[id,s]=v2(b).split('|');S.reqs.find(r=>r.id==id).st=s;render()},
ch(b){S.ch=+v2(b);render()},
send(){const t=g('cm').trim();if(!t)return;S.chat.push({emp:S.u.admin?S.ch:S.u.id,from:S.u.admin?'admin':'emp',t,tm:nowT()});render()}};
H.ch=b=>{S.ch=+v2(b);render()};H.back=()=>{S.ch=null;render()};
H.fill=b=>{const[u,p]=v2(b).split('|');document.getElementById('lu').value=u;document.getElementById('lp').value=p};
H.eye=b=>{const i=document.getElementById('lp'),s=i.type=='password';i.type=s?'text':'password';b.textContent=s?'إخفاء':'إظهار'};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)H[b.dataset.a](b)});
document.addEventListener('change',e=>{const c=e.target.dataset.c;if(!c)return;const[k,id]=c.split('|');if(k=='task'){S.tasks.find(t=>t.id==id).st=e.target.value}else{(S.ded[id]=S.ded[id]||{})[k]=e.target.value}render()});
document.addEventListener('keydown',e=>{if(e.key=='Enter'){const b=document.querySelector(e.target.id=='cm'?'[data-a=send]':e.target.id=='lp'?'[data-a=login]':'');if(b)b.click()}});
render();
</script></body></html>
